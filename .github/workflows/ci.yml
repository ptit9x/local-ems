name: CI
on:
  push:
  pull_request:
jobs:
  local:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ems-local } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: ems-local/go.mod, cache-dependency-path: ems-local/go.sum }
      - run: go test -race ./... -count=1
      - run: go vet ./...
  cloud:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ems-cloud } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm, cache-dependency-path: ems-cloud/package-lock.json }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test
      - run: npm run test:contracts
