services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ems_cloud}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ems-mosquitto
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      DATABASE_URL: postgresql://ems:ems_secret@postgres:5432/ems_cloud?schema=public
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_TOPIC_PREFIX: ems
      JWT_SECRET: ${JWT_SECRET:-simulator-demo-secret-change-me}
      CORS_ORIGIN: http://localhost:5173
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  dashboard:
    build: { context: ., dockerfile: Dockerfile.dashboard }
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
