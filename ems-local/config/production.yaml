# Local EMS — Production Configuration
# 4 BMS (5MW each), 24 PCS, 1 Power Meter

site:
  id: "prod-site-1"
  name: "Production Facility Alpha"

simulate: false

devices:
  bms:
    - { id: bms-0, host: 10.0.1.10, port: 502, unit: 1 }
    - { id: bms-1, host: 10.0.1.11, port: 502, unit: 1 }
    - { id: bms-2, host: 10.0.1.12, port: 502, unit: 1 }
    - { id: bms-3, host: 10.0.1.13, port: 502, unit: 1 }
  pcs:
    - { id: pcs-0,  host: 10.0.2.10, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-1,  host: 10.0.2.11, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-2,  host: 10.0.2.12, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-3,  host: 10.0.2.13, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-4,  host: 10.0.2.14, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-5,  host: 10.0.2.15, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-6,  host: 10.0.2.16, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-7,  host: 10.0.2.17, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-8,  host: 10.0.2.18, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-9,  host: 10.0.2.19, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-10, host: 10.0.2.20, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-11, host: 10.0.2.21, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-12, host: 10.0.2.22, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-13, host: 10.0.2.23, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-14, host: 10.0.2.24, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-15, host: 10.0.2.25, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-16, host: 10.0.2.26, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-17, host: 10.0.2.27, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-18, host: 10.0.2.28, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-19, host: 10.0.2.29, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-20, host: 10.0.2.30, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-21, host: 10.0.2.31, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-22, host: 10.0.2.32, port: 502, unit: 1, brand: generic, command_mode: individual }
    - { id: pcs-23, host: 10.0.2.33, port: 502, unit: 1, brand: generic, command_mode: individual }
  meter:
    - { id: meter-grid,  host: 10.0.3.10, port: 502, unit: 1, role: grid, fast_ms: 200 }
    - { id: meter-solar, host: 10.0.3.11, port: 502, unit: 2, role: solar }
    - { id: meter-load,  host: 10.0.3.12, port: 502, unit: 3, role: load }
  ev_charger:
    - { id: evc-0, host: 10.0.4.10, port: 502, unit: 1, protocol: modbus }
    - { id: evc-1, host: 10.0.4.11, port: 502, unit: 1, protocol: modbus }
    - { id: evc-2, host: 10.0.4.12, port: 502, unit: 1, protocol: modbus }
    - { id: evc-3, host: 10.0.4.13, port: 502, unit: 1, protocol: modbus }
    - { id: evc-4, host: 10.0.4.14, port: 502, unit: 1, protocol: modbus }
    - { id: evc-5, host: 10.0.4.15, port: 502, unit: 1, protocol: modbus }

topology:
  pcc_meter: meter-grid
  solar_meter: meter-solar
  load_meter: meter-load
  bess_groups:
    - name: group-0
      bms: [bms-0]
      pcs: [pcs-0, pcs-1, pcs-2, pcs-3, pcs-4, pcs-5]
      command_mode: individual
    - name: group-1
      bms: [bms-1]
      pcs: [pcs-6, pcs-7, pcs-8, pcs-9, pcs-10, pcs-11]
      command_mode: individual
    - name: group-2
      bms: [bms-2]
      pcs: [pcs-12, pcs-13, pcs-14, pcs-15, pcs-16, pcs-17]
      command_mode: individual
    - name: group-3
      bms: [bms-3]
      pcs: [pcs-18, pcs-19, pcs-20, pcs-21, pcs-22, pcs-23]
      command_mode: individual

polling:
  fast_ms: 200
  standard_ms: 1000
  slow_ms: 5000

engine:
  cycle_ms: 1000
  distribution: equal

storage:
  driver: timescaledb
  dsn: postgres://ems:ems@localhost:5432/ems?sslmode=disable
  retention_days: 90
  wal_mode: false

sync:
  enabled: true
  mqtt_broker: "ssl://cloud.example.com:8883"
  client_id: "prod-ems"
  topic_prefix: "ems/prod"
  interval_seconds: 300
  buffer_days: 14

ui:
  port: 8080
  username: admin
  password: ems@2025
